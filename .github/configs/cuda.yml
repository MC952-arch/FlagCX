# CUDA Hardware Configuration
hardware_name: cuda
display_name: CUDA Tests

ci_image: harbor.baai.ac.cn/flagscale/flagscale-train:dev-cu128-py3.12-20260228210721

runner_labels:
  - self-hosted
  - nv-8g-cicd-flagcx

container_volumes: []

container_options: >-
  --gpus all
  --privileged
  --ipc=host
  --ulimit memlock=-1
  --ulimit stack=67108864

set_env: .github/scripts/set_env/cuda.sh

unit_test_suites:
  - adaptor
  - core
  - device_api
  - p2p
  - rma
  - runner
  - service
  - symmem
