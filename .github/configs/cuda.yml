# CUDA CI configuration.
#
# Adding another accelerator should only require another file in this directory
# and a matching set_env script. The common workflows must remain platform
# agnostic.
platform: cuda
display_name: CUDA

runner_labels:
  - self-hosted
  - cx-build

container:
  image: localhost:5000/flagscale:cuda12.8.1-cudnn9.7.1-python3.12-torch2.7.0-time2507111538
  options: >-
    --gpus all
    --privileged
    --ipc=host
    --ulimit memlock=-1
    --ulimit stack=67108864

set_env: .github/scripts/set_env/cuda.sh

unit_test_suites:
  - adaptor
  - core
  - device_api
  - p2p
  - rma
  - runner
  - service
  - symmem
